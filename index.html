<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 应用已保存的主题(默认亮色),避免刷新时闪烁
      try {
        var t = localStorage.getItem('syphon-theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <title>Syphon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
