[package]
name = "syphon"
version = "0.2.7"
description = "Syphon 节点化数据处理工作台"
edition = "2021"

[lib]
name = "syphon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
