# Syphon 发布工作流:推送 v* 标签时,分别在 Ubuntu 与 Windows 上构建安装包,
# 并以 GitHub Release 形式发布 v0.2.0 及以后的版本。
name: release

on:
  # 推送 v* 标签(如 v0.2.0)时触发
  push:
    tags:
      - 'v*'
  # 也支持手动触发(仓库 Actions 页面 → Run workflow)
  workflow_dispatch:

jobs:
  # 先创建 Release 占位,拿到 release_id 供各平台上传
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        id: create-release
        uses: taiki-e/create-gh-release-action@v1
        with:
          # 读取上一次提交信息作为 Release 说明
          changelog: '自动生成的发布说明,可在发布后编辑'
          token: ${{ secrets.GITHUB_TOKEN }}

  # 多平台并行构建:Linux(deb + AppImage)与 Windows(NSIS)
  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 构建 WebKitGTK/GTK 等系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 构建并上传安装包到已创建的 Release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Syphon ${{ github.ref_name }}'
          releaseBody: '请下载对应平台的安装包进行安装。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
